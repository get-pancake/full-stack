# Pancake Tower — recipe & build spec
# Single source of truth. calc.py reads this file; every number in the docs comes from here.
# Units: US first (in, °F, cups), metric where cooks need it.

[meta]
version = "2.0.0"
status = "attempted"         # Oct 29: ~0.6 in over the record, fell when let go. Not a record. See TESTLOG.md
source = "Chef's quantity sheet, Oct 28, 2026 (Candido Blanco)"

[event]
start = "2026-10-29T17:00:00-07:00"   # doors open, San Francisco time. A string, so the page can parse it
date = "Oct 29, 2026"
place = "San Francisco"
live_hours = 6                # the page says "live now" for this long after the start

[target]
record_height_in = 42.6      # 108.3 cm, the height to beat
slow_down_at_in = 44.0        # stacker slows down, last ~10 top pancakes
build_to_in = 45.0            # STOP line. Stop on height, never on pancake count
settle_ratio = 0.05           # expected height loss while stacking (measure it)

[batter]
# One batch = the chef's base batch. Every quantity in the plan is a whole number of batches.
# Amounts are in the units the chef measures with; calc.py converts to grams.
density_g_per_ml = 1.10       # guess, weigh 1 cup of batter and update
rest_minutes = 20             # chef's call: he found thickening came from griddle heat, not resting

[[batter.ingredient]]
key = "flour_all_purpose"
amount = 250
unit = "g"
why = "Structure"

[[batter.ingredient]]
key = "eggs"
amount = 1
unit = "egg"
why = "Binds and sets the crumb"

[[batter.ingredient]]
key = "sugar"
amount = 3
unit = "tsp"
why = "Color and taste"

[[batter.ingredient]]
key = "whole_milk"
amount = 1.5
unit = "cup"
why = "Thin, pourable batter that levels itself in the ring"

[[batter.ingredient]]
key = "water"
amount = 0.5
unit = "cup"
why = "Thins the batter without adding fat"

[cook]
griddle_temp_f = [330, 350]   # check with the surface thermometer, it drives batter thickening
grease = "cooking spray"      # chef's choice (PAM). Most sprays contain soy lecithin: list soy on the allergen sign
spray_cans = 6
target_cooked_thickness_in = 0.186   # ~4.7 mm cooked, ~4.5 mm in the stack after settling (chef: 0.45 cm)
reject_below_in = 0.12        # 3 mm
reject_above_in = 0.35        # 9 mm, at the thickest point
cool_flat_minutes = 18        # chef measured 18 min to cool fully on a rack. Never stack warm
spare_ratio = 0.07            # chef's extras, then rounded up to whole batches
egg_weight_g = 50

# The tower: two ring sizes, biggest at the bottom. One batch makes `per_batch` pancakes of that size.
[[size]]
name = "base"
ring_in = 9
in_tower = 145
per_batch = 3                 # ~1 cup of batter each

[[size]]
name = "top"
ring_in = 7
in_tower = 125
per_batch = 7                 # a scant 1/2 cup each

[shopping]
margin = 0.05                 # buy at least 5% over what the batches use (broken eggs, spills)
flour_bag_lb = 5

[rules]
# Confirmed on the call with the adjudicator, Oct 22: width measured before stacking,
# standard ingredients only, nothing around the stack, up to 3 attempts in 8 h.
max_diameter_in = 9.84        # 25 cm
min_diameter_in = 4.92        # 12.5 cm
max_thickness_in = 0.39       # 1 cm
hold_seconds = 5

# Texturizers. OFF, and staying off: the adjudicator asked for standard ingredients (Oct 22).
[experimental]
xanthan_gum = 0.0
methylcellulose = 0.0
vital_wheat_gluten = 0.0
